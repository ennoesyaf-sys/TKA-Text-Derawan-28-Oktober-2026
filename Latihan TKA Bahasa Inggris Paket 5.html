{k:"Derawan",title:"Derawan Islands",q:"Soal 1",
 text:["Located just away from the mainland of East Kalimantan in the district of Berau, the Derawan archipelago comprises 31 islands, most well-known among these are the islands of Derawan, Maratua, Sangalaki, and Kakaban. Here is Indonesia’s largest nesting site of the rare and endangered giant green turtles and hawksbill turtles, where one can daily watch turtles lay their eggs in the sand or swim to sea with the turtles.","The entire marine conservancy region covers a total area of no less than 1.27 million hectares. It is the perfect tropical paradise with warm, isolated islands, soft white sand beaches fringed with waving palm trees, pristine seas that change color from green to deep blue, and an amazing underwater life of giant turtles, dolphins, manta rays, dugongs and barracudas, stingless jellyfish and sometimes, whales. Here, you can find 460 different species of corals, ranking this area second only to the Raja Ampat Islands in West Papua. The Nature Conservancy and a team of international experts also found more than 870 species of fish here, ranging from tiny pygmy seahorses to giant manta rays."],src:"Source: Boborneo Tour",

{k:"Short Escape",title:"Short Escape",q:"Soal 2-4",
 text:["Last weekend, my friends and I embarked on a much-anticipated trip to Puncak Guha, Garut. We had carefully planned it as a short escape from our daily routines. We set off at dawn on our motorcycles and arrived nearly six hours later.","Upon arrival, we were greeted by a stunning coastal landscape. The sun was shining, waves crashed against the shore, and strong winds swept across our faces. Then, we had lunch at a small diner while waiting for the wind to calm. By late afternoon, the wind had softened. We quickly assembled our tent at our chosen site and watched the sunset while enjoying snacks.","As night fell, we cooked our dinner using the supplies we brought from home. The rest of the evening was filled with laughter and conversation, sharing stories, worries, and memories. In that quiet, reflective space, our stress seemed to fade. Later, fireworks lit up the sky, drawing us into a moment of silence and awe. Though no words were exchanged, the shared experience left a lasting impression. I felt a deep sense of gratitude and peace.","As fatigue set in, we slowly drifted off to sleep. It was a short escape, but one that reminded us of the value of friendship and quiet moments away from the everyday rush."],src:"Source: Alya/GMP",
 v:["embarked on|memulai (perjalanan)","much-anticipated|sangat dinanti","escape|pelarian, melepas penat","set off|berangkat","dawn|fajar","greeted|disambut","assembled|mendirikan","supplies|perbekalan","reflective|penuh renungan","awe|rasa kagum","gratitude|rasa syukur","fatigue|kelelahan"],

{k:"Tom Kitten",title:"The Tale of Tom Kitten",q:"Soal 5-7",
 text:["Once upon a time, there were three kittens named Mittens, Tom Kitten, and Moppet. They loved to play outside, but one day their mother, Mrs. Tabitha Twitchit, was expecting guests for tea. She brought them in to wash and dress them. First, she cleaned their faces, brushed their fur, and combed their tails. Tom was naughty and scratched. Then she dressed Moppet and Mittens in neat pinafores and tried to dress Tom in fancy clothes, but he had grown too big and kept popping his buttons. Once dressed, Mrs. Tabitha unwisely turned them out into the garden, to be out of the way while she made hot buttered toast.","Moppet and Mittens tried walking on their hind legs but tripped and got their clothes dirty. They climbed a rockery, turned their pinafores backward, and tried to sit on a garden wall. Tom struggled up, losing more buttons, until his clothes fell apart. Just then, three ducks—Rebecca, Jemima, and Mr. Drake Puddle-duck—came marching by. Curious, they picked up Tom’s fallen clothes and put them on, though they didn’t fit.","Mittens laughed so hard she fell off the wall. As the kittens scrambled down, more clothes came off. Mr. Drake tried to help dress Tom, but ended up wearing the clothes himself. The ducks marched off in them.","Mrs. Tabitha found the kittens undressed. She pulled them off the wall. Then, she smacked them, and took them back to the house."],src:"Adapted from: Beatrix Potter/Puddleduck Literature",
 v:["naughty|nakal","pinafores|celemek anak","fancy|mewah, bagus","popping|(kancing) lepas","unwisely|tidak bijaksana","hind legs|kaki belakang","rockery|taman batu","struggled|berjuang, kesulitan","scrambled|bergegas turun","smacked|menampar, memukul"],
 g:[["Paragraf 1","What does Mrs. Tabitha do and why?","Memandikan dan mendandani anak-anaknya karena tamu akan datang; Tom kekecilan bajunya; mereka disuruh main di kebun. Label: Dressing the kittens."],["Paragraf 2","What goes wrong in the garden?","Anak kucing kotor, baju Tom lepas, tiga bebek memakai baju itu. Label: Clothes everywhere."],["Paragraf 3","What happens next?","Mittens jatuh karena tertawa; Mr. Drake memakai baju Tom dan bebek pergi. Label: The ducks take the clothes."],["Paragraf 4","How does it end?","Mrs. Tabitha menemukan mereka tanpa baju, menampar, dan membawa pulang. Label: Mother’s reaction."]],
 qs:[S("5","Why can Tom Kitten’s struggle with his clothing be considered one of the most amusing and central parts of the story?",["It represents a human’s behavior.","It highlights the bond between the kittens.","It causes the conflict and chaos that follow.","It teaches readers about the importance of good manners.","It shows how clumsy he is while playing with the ducks."],2,"Baju Tom yang kekecilan dan lepas memicu semua kejadian lanjutan: bebek memakainya, baju lain ikut lepas, ibu marah."),

 M("7","What is the most likely to happen after the incident? Tick (✓) the possible impact of the incident. You can tick more than one impact.",["The kittens might get scolded again at home.","Mrs. Tabitha will not dress her kittens again.","Mittens and Moppet will stop talking to the Tom Kitten.","The kittens may be more careful next time they are dressed.","Mrs. Tabitha will proudly tell her guests about the incident since the tea party is over."],[0,3],["Ibu sangat marah dan tamu akan datang.","Berlebihan, tidak ada petunjuk.","Tidak ada petunjuk.","Pengalaman buruk membuat mereka lebih hati-hati.","Kejadian memalukan, ibu tidak akan bangga."])]},
{k:"Dutch Rule",title:"Indonesian Society and Dutch Rule",q:"Soal 8-10",
 text:["Before the 19th century, Indonesian societies had limited European pressure but were not deeply influenced by Western culture or governance. The political power of the Javanese kingdom of Mataram had declined, and early steps toward Dutch administration control in Java were emerging. In other regions, local rulers were pressured into following Dutch authority based in Batavia (now Jakarta). Although trading systems were altered and restricted, traditional social structures and local stability remained largely intact.","When the Dutch returned to Indonesia in 1816 after the Napoleonic Wars, their focus was on making the colony economically self-sufficient. During the British interregnum, exports even and revenue had dropped. The Dutch retained much of the British administrative system, such as residencies and regencies—but unlike the British, they maintained traditional hierarchies by seeing local regents as “younger brothers” to Dutch residents. Despite this, control became increasingly centralized, driven by growing governance needs, regional unrest, and the introduction of the 1830 economic policy that increased the responsibilities of local officials.","A major challenge to Dutch rule came during the Java War (1825–1830). The war was triggered by multiple causes: Prince Diponegoro’s frustration at being denied succession, the anger of aristocrats over canceled land leases to Europeans, and the rising influence of Islamic and mystical beliefs, including hopes for a just messianic ruler. The rebellion, sustained by guerrilla tactics, lasted five years. It ended only after Diponegoro was captured during false truce negotiations and exiled to Celebes (Sulawesi). This marked a deeper phase of Dutch dominance in Java."],src:"Adapted from: Indonesian Society in Transition, W.F. Wertheim/W. van der W.",
 v:["pressure|tekanan","governance|tata kelola pemerintahan","administration|pemerintahan","intact|utuh, tidak rusak","self-sufficient|mandiri, swasembada","interregnum|masa peralihan pemerintahan","hierarchies|hierarki, tingkatan kekuasaan","centralized|terpusat","unrest|gejolak, kerusuhan","succession|hak waris takhta","rebellion|pemberontakan","guerrilla|gerilya","truce|gencatan senjata","exiled|diasingkan","dominance|dominasi"],
 g:[["Paragraf 1","What was Indonesian society like before the 19th century?","Tekanan Eropa terbatas; perdagangan dibatasi tetapi struktur sosial dan stabilitas lokal tetap utuh. Label: Society before the 1800s."],["Paragraf 2","What did the Dutch focus on after 1816?","Membuat koloni mandiri secara ekonomi; mempertahankan hierarki tradisional tetapi kontrol makin terpusat. Label: The Dutch return."],["Paragraf 3","What was the Java War and how did it end?","Pemberontakan 1825-1830 dipimpin Diponegoro; ia ditangkap saat perundingan palsu dan diasingkan. Label: The Java War."]],
 qs:[S("8","How was Indonesia’s society before the 19th century?",["It had no political organization.","It had been consumed by Dutch influence.","It remained largely intact despite European presence.","It was completely isolated from foreign influence.","It had already adopted many Western cultural norms."],2,"Paragraf 1: struktur sosial tradisional dan stabilitas lokal “remained largely intact”. Pilihan lain bertentangan (ada Mataram, tidak terisolasi, belum dikuasai)."),
 S("9","In what ways did the exile of Diponegoro have an impact on Java?",["It led to the establishment of the young people of Java.","It caused Islam to disappear as a major influence in Javanese society.","It improved relationships between local rulers and Dutch colonial authorities.","It resulted in Prince Diponegoro becoming the new ruler of the Dutch East Indies.","It weakened the traditional Javanese aristocracy and increased Dutch political control."],4,"Setelah ia diasingkan, teks menyebut “a deeper phase of Dutch dominance”: aristokrasi melemah, kontrol Belanda menguat."),
 M("10","Read the following statements. Tick (✓) the correct statements based on the text. You can tick more than one statement.",["The Dutch responded to the Java War by granting Diponegoro more land and autonomy.","The Dutch used Batavia (modern Jakarta) as the center of their colonial authority in Indonesia.","The Dutch returned to Indonesia in 1816 mainly to restore political harmony with local kingdoms.","Local rulers outside Java were completely free from Dutch pressure during the early colonial period.","One cause of the Java War was Prince Diponegoro’s disappointment at being denied his royal inheritance."],[1,4],["Ia ditangkap dan diasingkan.","“authority based in Batavia (now Jakarta)”.","Fokus 1816 adalah swasembada ekonomi.","Penguasa di luar Jawa “were pressured”.","“frustration at being denied succession”."])]},

{k:"Smartwatch",title:"Smartwatch",q:"Soal 18-20",
 text:["Smartwatch is a small smartphone-like device worn on the wrist. Many smartwatches are connected to a smartphone that notifies the user of incoming calls, e-mail messages, and notifications from applications. Some smartwatches can even make telephone calls. Many smartwatches have color displays, but some inexpensive models use a black-and-white “e-paper” display. The user can operate the smartwatch through a touch screen, physical buttons, or a combination of the two. Some smartwatches come with pedometers and heart-rate monitors to help users track their health. A smartwatch does not always need to be connected to a phone to function, but certain features will be limited when disconnected. While some features, like notifications and data syncing, require a connection, many watches can still perform tasks independently. As computers shrank in size in the 20th century, electronic equipment became small enough to fit into a watch."],src:"Source: Eric Gregsen (Britannica)",

{k:"Physical Activity",title:"Dialog: Namira and Timothy",q:"Soal 21-23",
 text:["<b>Namira:</b> “I am exhausted. I can’t feel my legs anymore.”","<b>Timothy:</b> “Keep it up, Namira. Let’s cross the finishing line together.”","<b>Namira:</b> “Ah, finally. By the way, why don’t you look drained at all? You seem to enjoy running, too.”","<b>Timothy:</b> “It’s actually fun to do physical activities together. It’s good to be sweating. It speeds up metabolism and reduces the building up of fats.”","<b>Namira:</b> “How much physical activity do we need anyway? Because I barely do any.”","<b>Timothy:</b> “At least a cumulative 60 minutes of moderate to vigorous physical activity every day.”","<b>Namira:</b> “I don’t even want to imagine it.”","<b>Timothy:</b> “It’s actually not difficult. Make good use of the time before and after school. For example, you can walk briskly to school and back home. Help out with chores when you get home. Cycle with your family or take a walk with them. As a result, you will have reached the 60 minutes mark.”","<b>Namira:</b> “You’re right. It does sound simple. What physical activity do you like?”","<b>Timothy:</b> “Besides brisk walking and playing in the park, I also play sports such as swimming, rope skipping, and badminton. It keeps my muscles and bones healthy. Don’t you know exercise can help relieve anxiety and depression?”","<b>Namira:</b> “Easy for you to say.”","<b>Timothy:</b> “But seriously, it also has a positive impact on studying.”","<b>Namira:</b> “No wonder you are optimistic. You get good grades and are friends with everyone.”","<b>Timothy:</b> “Stop it! It takes just a little time every day and you can have all the benefits.”","<b>Namira:</b> “Then, I should start engaging in different types of physical activities.”","<b>Timothy:</b> “You really should.”"],src:"Source: Nadia/GMP",dlg:1,

{k:"Monty Roberts",title:"Monty Roberts and the Horse Ranch",q:"Soal 24",
 text:["I have a friend, Monty Roberts, who owns a horse ranch in San Isidro. He generously lets me use his ranch for fund-raising events to support programs for at-risk youth.","At one such event, Monty introduced me by sharing a personal story. He said, “Let me explain why I allow you to use my ranch. It’s connected to something from my youth. I am the son of a traveling horse trainer who moves from one stable to another, track to track, farm to farm, training horses. This constant movement disrupted my schooling.”","When Monty was in high school, a teacher assigned his class to write about their future goals. He poured his heart into a detailed seven-page paper outlining his dream of owning a horse ranch. He even drew maps of a 200-acre property, complete with stables, a track, and the layout of a 4,000-square-foot house.","However, when the paper was returned, it had a big red F with a note, saying, “See me after class.” When meeting the teacher, Monty asked why he got an F.","“This is an unrealistic dream for a young boy like you. You have no money. You have no resources. Owning a horse ranch requires a lot of money. You have to buy the land. There’s no way you could ever do it.” Then, Monty was advised to rewrite the paper with a more “practical” goal to get a better grade.","Monty thought deeply about it. His father encouraged him to decide for himself. After a week, he resubmitted the same paper, unchanged, saying, “You can keep the F; I’ll keep my dream.”","Monty finished the story by saying, “You are sitting in the very house I described in that paper, on my 200-acre ranch. I’ve kept that paper framed above the fireplace ever since.” He smiled and added, “The best part? That same teacher brings some kids here 30 times a year.”"],src:"Adapted from: A Tale of Two Halves",
 v:["ranch|peternakan","fund-raising|penggalangan dana","at-risk youth|remaja rentan","stable|kandang kuda","disrupted|mengganggu","assigned|memberi tugas","unrealistic|tidak realistis","resources|sumber daya","practical|praktis, realistis","resubmitted|mengumpulkan ulang","framed|dibingkai"],
 g:[["Paragraf 1-2","Who is Monty and what does he explain?","Pemilik peternakan yang meminjamkan tempatnya untuk penggalangan dana; ia bercerita tentang masa mudanya. Label: Monty’s introduction."],["Paragraf 3","What did Monty write?","Makalah tujuh halaman tentang peternakan kuda 200 acre. Label: The dream paper."],["Paragraf 4-5","What did the teacher do?","Memberi nilai F, menyebut mimpinya tidak realistis, menyuruh menulis ulang. Label: The F."],["Paragraf 6","What did Monty do?","Mengumpulkan makalah yang sama tanpa diubah. Label: Keeping the dream."],["Paragraf 7","How does it end?","Ia kini memiliki peternakan itu; guru yang sama membawa anak-anak ke sana. Label: The dream comes true."]],
 qs:[S("24","Which part of the story becomes the turning point that makes the story interesting?",["When he shared his story with the writer.","When his teacher gave him an F and asked him to rewrite the assignment.","When he successfully built up a ranch just as he said on the paper of assignment.","When he got an F that was unchangeable the time he submitted the original paper.","When he talked to his father about what happened, his father insisted that he redo the assignment."],1,"Titik balik adalah konflik yang mengubah alur: guru memberi F dan menyuruh menulis ulang, sehingga Monty harus memilih menyerah atau mempertahankan mimpinya. (Keputusan mengumpulkan ulang juga bisa dianggap titik balik, tetapi kunci memilih B.)")]},
{k:"Job Interview",title:"Dialog: Hasan and Yusuf",q:"Soal 25-27",
 text:["<b>Yusuf:</b> “Did you have a pleasant time in Jakarta?”","<b>Hasan:</b> “I did, although I was actually there for a job interview.”","<b>Yusuf:</b> “Really? How did it go?”","<b>Hasan:</b> “Overall, it went fairly well, but I encountered a few issues beforehand.”","<b>Yusuf:</b> “Oh? What happened?”","<b>Hasan:</b> “I wanted to make a good impression, so after brushing my teeth, I reached for what I assumed was mouthwash to freshen up. Unfortunately, it turned out to be aftershave. It burned quite a bit.”","<b>Yusuf:</b> “That sounds terrible.”","<b>Hasan:</b> “It was quite unpleasant. I rinsed my mouth out immediately. Then, while getting dressed, I realized I had forgotten to pack my best shirt. I had left it at home after ironing it.”","<b>Yusuf:</b> “That’s unfortunate. What did you do?”","<b>Hasan:</b> “I had to settle for another shirt and hurry out. I arrived at the company just in time and joined the other candidates in the lobby. That’s when I noticed I had put my shirt on inside-out.”","<b>Yusuf:</b> “Seriously?”","<b>Hasan:</b> “Yes. I quickly went to the restroom to fix it, and I made it back just as the receptionist called us in. Fortunately, I was still able to remain composed and confident throughout the interview.”","<b>Yusuf:</b> “I’m glad it worked out in the end. I hope you get the position.”","<b>Hasan:</b> “Thank you. I hope so as well.”"],src:"Source: Siska/GMP",dlg:1,

 g:[["Awal","Why was Hasan in Jakarta?","Untuk wawancara kerja. Label: The reason."],["Masalah 1","What did Hasan use by mistake?","Aftershave, bukan obat kumur; terasa perih. Label: The mouthwash mistake."],["Masalah 2","What did he forget?","Kemeja terbaiknya, jadi memakai kemeja lain. Label: The forgotten shirt."],["Masalah 3","What did he notice in the lobby?","Kemejanya terbalik; ia memperbaikinya di toilet tepat waktu. Label: The inside-out shirt."],["Akhir","How did the interview go and how does Yusuf react?","Hasan tetap tenang dan percaya diri; Yusuf berharap ia diterima. Label: A good ending."]],
 qs:[S("25","What was Hasan’s intention in going to Jakarta?",["He hung out with Yusuf.","He attended a job interview.","He traveled to a company gathering.","He had a meeting with his coworker.","He went to do some working urgencies."],1,"“I was actually there for a job interview.”"),
 S("26","Based on the dialog, how was Yusuf portrayed?",["Yusuf’s initial inquiry about Hasan’s time in Yogyakarta indicates his nosy trait.","Yusuf’s responses to Hasan talking about the incident in Yogyakarta show he is impatient and bored.","Yusuf’s encouraging response about the mouthwash incident shows he is judgmental and unsupportive.","Yusuf’s responses after hearing the misfortune indicate that he was nonjudgmental and supportive.","Yusuf’s reaction to Hasan’s forgotten shirt indicates that he was attentively engaged and empathetic in the conversation."],3,"Yusuf bersimpati (“That sounds terrible”, “That’s unfortunate”), tidak mengejek, dan berharap Hasan diterima. Opsi A dan B menyebut Yogyakarta padahal dialog di Jakarta. Opsi E juga masuk akal, tetapi kunci memilih D."),

{k:"Domestic Waste",title:"Domestic Waste",q:"Soal 28-30",
 text:["Let’s reflect on your habit. How often do you produce domestic waste in a day? Probably a lot, right? Domestic waste is any waste that is produced in the home environment. There is a wide range of types of waste that humans produce, and this comes from an equally wide range of activities.","Domestic waste may be biodegradable or non-biodegradable waste. Biodegradable waste refers to the waste that comes from our kitchen, and it includes food remains, garden waste, et cetera. Biodegradable waste is also known as moist waste. This can be composted to obtain manure. Biodegradable wastes decompose themselves over a period of time, depending on the material.","Non-biodegradable waste includes old newspaper, broken glass pieces, plastics, et cetera. Non-biodegradable waste is known as dry waste. Dry waste can be recycled and can be reused. Non-biodegradable wastes do not decompose themselves, and hence are a major pollutant."],src:"",

 g:[["Paragraf 1","What is domestic waste?","Sampah yang dihasilkan di lingkungan rumah dari berbagai aktivitas. Label: Definition."],["Paragraf 2","What is biodegradable waste?","Sampah dapur dan kebun; sampah basah; bisa dikomposkan dan terurai seiring waktu. Label: Biodegradable waste."],["Paragraf 3","What is non-biodegradable waste?","Koran bekas, pecahan kaca, plastik; sampah kering; bisa didaur ulang, tidak terurai, pencemar utama. Label: Non-biodegradable waste."]],

main.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){var a=document.getElementById(b.dataset.a);a.classList.toggle("show");b.textContent=a.classList.contains("show")?"Sembunyikan jawaban":"Lihat jawaban"}});
main.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){check(+b.dataset.c)}});
main.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){key(+b.dataset.k)}});
main.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){reset(+b.dataset.r)}});
window.scrollTo(0,0)}
function qBody(q,j){var h="";
if(q.t=="s")q.o.forEach(function(o,i){h+="<label class='row' id='r"+j+"_"+i+"'><input type='radio' name='q"+j+"' value='"+i+"'><span><b>"+LETT[i]+".</b> "+o+"</span></label>"});
if(q.t=="m")q.o.forEach(function(o,i){h+="<label class='row' id='r"+j+"_"+i+"'><input type='checkbox' value='"+i+"'><span>"+o+"</span></label>"});
if(q.t=="f")q.o.forEach(function(o,i){h+="<div class='row' id='r"+j+"_"+i+"'><span>"+o+"</span><span class='tf'><label><input type='radio' name='q"+j+"_"+i+"' value='1'>"+q.l[0]+"</label><label><input type='radio' name='q"+j+"_"+i+"' value='0'>"+q.l[1]+"</label></span></div>"});
return h}
function val(q,j,i){var c=document.getElementById("q"+j);
if(q.t=="s"){var x=c.querySelector("input:checked");return x?+x.value:-1}
if(q.t=="m")return c.querySelectorAll("input")[i].checked?1:0;
var y=c.querySelector("input[name='q"+j+"_"+i+"']:checked");return y?+y.value:-1}
function check(j){var q=D[cur].qs[j],n=0,tot=q.t=="s"?1:q.o.length,html="";
if(q.t=="s"){var v=val(q,j,0);document.querySelectorAll("#q"+j+" .row").forEach(function(r,i){r.classList.remove("right","wrong");if(i==q.a)r.classList.add("right");else if(i==v)r.classList.add("wrong")});if(v==q.a)n=1;html=q.w}
else{q.o.forEach(function(o,i){var v=val(q,j,i),want=q.t=="m"?(q.a.indexOf(i)>=0?1:0):q.a[i],r=document.getElementById("r"+j+"_"+i);r.classList.remove("right","wrong");if(v==want){n++;r.classList.add("right")}else r.classList.add("wrong");
var st=q.t=="m"?(want?"Dipilih":"Tidak dipilih"):q.l[want?0:1];html+="<br><b>"+(i+1)+". "+st+":</b> "+q.w[i]})}
document.getElementById("res"+j).textContent=(q.t=="s"?(n?"Benar":"Belum tepat"):"Skor: "+n+" dari "+tot);
document.getElementById("wh"+j).innerHTML=q.t=="s"?"<b>Pembahasan:</b> "+html:"<b>Pembahasan:</b>"+html}
function key(j){var q=D[cur].qs[j],c=document.getElementById("q"+j);
if(q.t=="s")c.querySelectorAll("input")[q.a].checked=true;
else if(q.t=="m")c.querySelectorAll("input").forEach(function(x,i){x.checked=q.a.indexOf(i)>=0});
else q.o.forEach(function(o,i){c.querySelector("input[name='q"+j+"_"+i+"'][value='"+q.a[i]+"']").checked=true});
check(j)}
function reset(j){var c=document.getElementById("q"+j);c.querySelectorAll("input").forEach(function(x){x.checked=false});c.querySelectorAll(".row").forEach(function(r){r.classList.remove("right","wrong")});document.getElementById("res"+j).textContent="";document.getElementById("wh"+j).innerHTML=""}
var m=/^#t(\d+)$/.exec(location.hash||"");go(m&&D[m[1]-1]?m[1]-1:0);
</script>
